<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Island Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Aesthetic Island</h1>
    <h2>Aesthetic Review & Recommendation Portal</h2>

    <form id="clientForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="concern">What are you concerned about or interested in?</label>
        <textarea id="concern" name="concern" required></textarea>

        <label for="photo">Upload a Photo</label>
        <input type="file" id="photo" name="photo" accept="image/*" required>

        <button type="submit">Submit for Review</button>
    </form>

</body>
</html>
